spring:
  application:
    name: mcp-server
  datasource:
    url: jdbc:h2:mem:studentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    mcp:
      server:
        name: student-mcp-server
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
server:
  port: 8080
logging:
  level:
    kmo.dev: DEBUG
    org.springframework.ai.mcp: DEBUG