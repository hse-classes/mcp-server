spring:
  application:
    name: mcp-server

  # H2 Datenbank Konfiguration
  datasource:
    url: jdbc:h2:mem:studentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # MCP Server Konfiguration für Spring AI 1.0.1
  ai:
    mcp:
      server:
        name: student-mcp-server
        version: 1.0.0
        type: SYNC  # oder ASYNC für reaktive Anwendungen

server:
  port: 8080

logging:
  level:
    de.example.mcp: DEBUG
    org.springframework.ai.mcp: DEBUG